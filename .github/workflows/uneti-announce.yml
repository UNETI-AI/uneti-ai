name: Đăng tin Nhà trường

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'thong-bao')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'go-tin')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Chỉ người có quyền ghi vào kho mã mới được đăng hoặc gỡ tin
        id: quyen
        env:
          ACTOR: ${{ github.actor }}
        run: |
          quyen="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo none)"
          case "$quyen" in
            admin|maintain|write) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Bỏ qua: $ACTOR không có quyền ghi." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.quyen.outputs.ok == 'true'

      # No concurrency group: GitHub cancels a queued run when a newer one arrives, which would lose
      # a notice silently. Each attempt starts from the newest main instead, so runs cannot clash.
      - name: Cập nhật danh sách tin và đưa lên nhánh chính
        id: tin
        if: steps.quyen.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for lan in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 uneti/add_announcement.py "$GITHUB_EVENT_PATH"
            if git diff --quiet ANNOUNCEMENTS.json; then exit 0; fi
            git add ANNOUNCEMENTS.json
            git commit -q -m "Tin Nhà trường #$NUMBER"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((lan * 3))
          done
          echo "::error::Không đưa được tin lên nhánh chính sau 5 lần thử."
          exit 1

      - name: Báo kết quả trên trang tin
        if: steps.quyen.outputs.ok == 'true'
        env:
          MESSAGE: ${{ steps.tin.outputs.message }}
          CHANGED: ${{ steps.tin.outputs.changed }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          if [ "$CHANGED" = "true" ]; then gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"; fi
