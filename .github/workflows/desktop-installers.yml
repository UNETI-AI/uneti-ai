name: Desktop installers

# Builds the two files a person downloads to install UNETI AI like an app:
#   UNETI-AI-Setup.exe   (Windows, Inno Setup)   packaging/windows/
#   UNETI-AI-macOS.dmg   (macOS, drag to Applications)   packaging/macos/
# and publishes them on the fixed release tag "desktop", so the download links never change:
#   https://github.com/uneti-ai/uneti-ai/releases/download/desktop/UNETI-AI-Setup.exe
#   https://github.com/uneti-ai/uneti-ai/releases/download/desktop/UNETI-AI-macOS.dmg
#
# Both installers are thin: they clone the newest UNETI AI on first run, so they only need a
# rebuild when the installer files themselves change, not on every release.
on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - "packaging/**"
      - "install.ps1"
      - "install.sh"
      - "open-uneti.vbs"
      - "start-uneti.vbs"
      - "stop-uneti.ps1"
      - "UNETI AI.bat"
      - "bin/uneti-start.sh"
      - "bin/uneti-stop.sh"
      - "bin/uneti-autostart.sh"
      - ".github/workflows/desktop-installers.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "install.ps1"
      - "install.sh"
      - "open-uneti.vbs"
      - "start-uneti.vbs"
      - "stop-uneti.ps1"
      - "UNETI AI.bat"
      - "bin/uneti-start.sh"
      - "bin/uneti-stop.sh"
      - "bin/uneti-autostart.sh"
      - ".github/workflows/desktop-installers.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Parse every PowerShell file the installers run, with the parser of Windows PowerShell 5.1
      # (what customers have), so a syntax slip fails here instead of on a customer's PC.
      - name: PowerShell syntax check
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @("install.ps1", "stop-uneti.ps1", "uneti-autostart.ps1", "packaging\windows\bootstrap.ps1", "packaging\windows\get-uneti.ps1")) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$f::$($_.Message) (line $($_.Extent.StartLineNumber))" } }
            else { Write-Host "ok  $f" }
          }
          if ($bad) { exit 1 }

      # Vietnamese wizard text is an unofficial Inno translation, not bundled with the compiler.
      - name: Vietnamese wizard text (best-effort)
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl" -OutFile packaging/windows/Vietnamese.isl -UseBasicParsing
          } catch { Write-Host "Vietnamese.isl unavailable, building English only: $($_.Exception.Message)" }

      # Code signing is OPTIONAL and off until the owner adds two repository secrets:
      #   WINDOWS_CERT_PFX_BASE64  the code signing certificate (.pfx) as base64
      #   WINDOWS_CERT_PASSWORD    its password
      # With them, Inno Setup signs both the setup .exe and its uninstaller (SignTool=uneti in
      # uneti-setup.iss), so Windows shows the publisher name instead of "Unknown publisher".
      # Without them the build is unsigned, exactly as before. Fork PRs never see secrets.
      - name: Build UNETI-AI-Setup.exe
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $sign = @()
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "uneti-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $tool) { throw "signtool.exe not found" }
            # Inno replaces $f with the file to sign and $q with a double quote.
            $sign = @("/DSign", "/Suneti=`$q$($tool.FullName)`$q sign /f `$q$pfx`$q /p `$q$($env:CERT_PWD)`$q /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f")
            Write-Host "Signing enabled"
          } else {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret: building unsigned"
          }
          & $env:ISCC "/DAppVersion=$v" @sign packaging\windows\uneti-setup.iss
          if ($LASTEXITCODE -ne 0 -and (Test-Path packaging/windows/Vietnamese.isl)) {
            # A translation written for a newer Inno can carry messages this compiler rejects:
            # ship English rather than no installer at all.
            Write-Host "::warning::Build with Vietnamese.isl failed, retrying English only"
            Remove-Item packaging/windows/Vietnamese.isl
            & $env:ISCC "/DAppVersion=$v" @sign packaging\windows\uneti-setup.iss
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($env:CERT_B64) {
            Remove-Item $pfx -Force
            $sig = Get-AuthenticodeSignature dist\UNETI-AI-Setup.exe
            Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "UNETI-AI-Setup.exe is not validly signed" }
          }
          Get-Item dist\UNETI-AI-Setup.exe | Format-List Name, Length

      # Real install of THIS commit on a clean runner, all four CLI brains included: bootstrap
      # clones the checkout and runs install.ps1 (venv, deps, Claude Code, Codex, Antigravity,
      # Grok, autostart). Then the server's own finders must see all four brains, and UNETI AI
      # must answer /health.
      - name: Smoke test - full install, four brains, UNETI AI starts
        shell: pwsh
        timeout-minutes: 45
        run: |
          git branch -f smoke-install HEAD
          $dir = Join-Path $env:RUNNER_TEMP "UNETI-AI"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\bootstrap.ps1 -Dir $dir -Repo $env:GITHUB_WORKSPACE -Branch smoke-install -NoPause -LogFile (Join-Path $env:RUNNER_TEMP "install.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "install.log") -Tail 80; exit 1 }
          $vpy = Join-Path $dir ".venv\Scripts\python.exe"
          if (-not (Test-Path $vpy)) { throw "venv missing" }
          if (-not (Test-Path (Join-Path $dir "open-uneti.vbs"))) { throw "open-uneti.vbs missing" }
          & $vpy (Join-Path $dir "packaging\check_brains.py")
          if ($LASTEXITCODE -ne 0) { throw "a brain CLI is missing after install" }
          Start-Process wscript.exe -ArgumentList "//nologo `"$dir\start-uneti.vbs`"" -WorkingDirectory $dir
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://127.0.0.1:7777/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if (-not $ok) { Get-Content (Join-Path $dir "server\uneti.log") -Tail 80 -ErrorAction SilentlyContinue; throw "UNETI AI did not answer /health" }
          Write-Host "UNETI AI is up after a fresh install"
          & (Join-Path $dir "stop-uneti.bat")

      # A port changed in .env must reach the icon, and only this copy's server may ever be stopped. Both strangers are
      # Python on purpose: one holds the default port, one runs a file with the same name as our server from elsewhere.
      - name: Smoke test - changed port, other programs left alone
        shell: pwsh
        timeout-minutes: 10
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "UNETI-AI"
          $other = Join-Path $env:RUNNER_TEMP "other-program"
          New-Item -ItemType Directory -Force (Join-Path $other "server") | Out-Null
          Set-Content (Join-Path $other "server\main.py") "import http.server, socketserver`nsocketserver.TCPServer(('127.0.0.1', 7802), http.server.SimpleHTTPRequestHandler).serve_forever()"
          $holder = Start-Process python -ArgumentList "-m", "http.server", "7777", "--bind", "127.0.0.1" -WorkingDirectory $other -PassThru
          $sameName = Start-Process python -ArgumentList "server\main.py" -WorkingDirectory $other -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            if ((Get-NetTCPConnection -LocalPort 7777 -State Listen -ErrorAction SilentlyContinue) -and (Get-NetTCPConnection -LocalPort 7802 -State Listen -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          Add-Content (Join-Path $dir ".env") "`nUNETI_PORT=7801"

          Start-Process wscript.exe -ArgumentList "//nologo `"$dir\open-uneti.vbs`"" -WorkingDirectory $env:RUNNER_TEMP
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://127.0.0.1:7801/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if (-not $ok) { Get-Content (Join-Path $dir "server\uneti.log") -Tail 80 -ErrorAction SilentlyContinue; throw "The icon did not start UNETI AI on the port in .env" }
          Write-Host "The icon started UNETI AI on the port in .env"

          # Clicking again must only open the window: a restart would kill work running in the background.
          $before = (Get-NetTCPConnection -LocalPort 7801 -State Listen).OwningProcess
          Start-Process wscript.exe -ArgumentList "//nologo `"$dir\open-uneti.vbs`"" -WorkingDirectory $env:RUNNER_TEMP
          Start-Sleep -Seconds 10
          if ((Get-NetTCPConnection -LocalPort 7801 -State Listen).OwningProcess -ne $before) { throw "A second click restarted the server" }
          Write-Host "A second click left the server running"

          & (Join-Path $dir "stop-uneti.bat")
          Start-Sleep -Seconds 3
          if (Get-NetTCPConnection -LocalPort 7801 -State Listen -ErrorAction SilentlyContinue) { throw "stop-uneti.bat left this copy's server running" }
          if ($holder.HasExited) { throw "stop-uneti.bat killed the program on port 7777" }
          if ($sameName.HasExited) { throw "stop-uneti.bat killed another program named server\main.py" }
          Write-Host "stop-uneti.bat stopped this copy and left the other two running"

          powershell -NoProfile -ExecutionPolicy Bypass -Command "`$env:UNETI_PORT='7777'; & '$dir\stop-uneti.ps1'"
          if ($holder.HasExited) { throw "stop-uneti.ps1 killed a stranger on its own port" }
          Write-Host "stop-uneti.ps1 leaves a stranger on its own port alone"
          Stop-Process -Id $holder.Id, $sameName.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: UNETI-AI-Setup
          path: dist/UNETI-AI-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build UNETI-AI-macOS.dmg
        run: bash packaging/macos/build-dmg.sh

      - name: Check the disk image
        run: |
          set -e
          mnt="$(hdiutil attach -nobrowse -readonly dist/UNETI-AI-macOS.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')"
          app="$mnt/UNETI AI.app"
          test -x "$app/Contents/MacOS/uneti"
          test -f "$app/Contents/Resources/bootstrap.sh"
          test -f "$app/Contents/Resources/uneti.icns"
          test -L "$mnt/Applications"
          plutil -lint "$app/Contents/Info.plist"
          bash -n "$app/Contents/MacOS/uneti"
          bash -n "$app/Contents/Resources/bootstrap.sh"
          bash -n packaging/macos/get-uneti.sh
          test -f "$mnt/.VolumeIcon.icns"
          GetFileInfo -a "$mnt" | grep -q C && echo "volume has the UNETI AI icon" || echo "::warning::volume custom-icon flag not set"
          hdiutil detach "$mnt"

      # The same first-run path a customer takes (bootstrap.sh -> install.sh), on this commit:
      # clone, venv, Node, all four CLI brains, LaunchAgent. The runner already has the
      # Command Line Tools and a Python 3.10+, so the xcode-select and uv branches are skipped.
      - name: Smoke test - full install, four brains, UNETI AI starts
        timeout-minutes: 45
        run: |
          set -e
          git branch -f smoke-install HEAD
          export UNETI_HOME="$RUNNER_TEMP/UNETI-AI" UNETI_REPO="$GITHUB_WORKSPACE" UNETI_BRANCH=smoke-install
          bash packaging/macos/bootstrap.sh < /dev/null
          export PATH="$HOME/.local/bin:$HOME/.uneti/node/bin:$PATH"
          "$UNETI_HOME/.venv/bin/python" "$UNETI_HOME/packaging/check_brains.py"
          for i in $(seq 1 60); do
            curl -sf -m 3 -o /dev/null http://127.0.0.1:7777/health && { echo "UNETI AI is up after a fresh install"; exit 0; }
            sleep 2
          done
          tail -80 "$UNETI_HOME/server/uneti.log" 2>/dev/null || true
          echo "UNETI AI did not answer /health"; exit 1

      # A port changed in .env must move the login agent when the icon is clicked, and stopping must leave other programs
      # alone, including a browser connected to the page, which a bare `lsof tcp:PORT` used to list.
      - name: Smoke test - changed port, other programs left alone
        timeout-minutes: 10
        run: |
          set -e
          home="$RUNNER_TEMP/UNETI-AI"
          printf '\nUNETI_PORT=7801\n' >> "$home/.env"
          bash "$home/bin/uneti-start.sh"
          up=""
          for i in $(seq 1 60); do
            if curl -sf -m 3 -o /dev/null http://127.0.0.1:7801/health; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then tail -80 "$home/server/uneti.log" || true; echo "The icon did not move UNETI AI to the port in .env"; exit 1; fi
          grep -q "<string>7801</string>" "$HOME/Library/LaunchAgents/com.uneti.os.plist"
          echo "The icon moved the login agent to the port in .env"

          python3 -m http.server 7777 --bind 127.0.0.1 >/dev/null 2>&1 &
          holder=$!
          for i in $(seq 1 30); do
            if lsof -nP -iTCP:7777 -sTCP:LISTEN -t >/dev/null; then break; fi
            sleep 1
          done
          UNETI_PORT=7777 bash "$home/bin/uneti-stop.sh" | tee stop.log
          grep -q "another program" stop.log
          kill -0 "$holder"
          echo "uneti-stop.sh leaves a stranger on its port alone"
          kill "$holder"

          python3 - <<'PY' &
          import http.client, pathlib, time
          connection = http.client.HTTPConnection("127.0.0.1", 7801)
          connection.request("GET", "/health")
          connection.getresponse().read()
          pathlib.Path("client-connected").touch()
          time.sleep(120)
          PY
          client=$!
          for i in $(seq 1 30); do
            if [ -f client-connected ]; then break; fi
            sleep 1
          done
          before="$(lsof -nP -iTCP:7801 -sTCP:LISTEN -t)"
          bash "$home/bin/uneti-stop.sh"
          sleep 15
          after="$(lsof -nP -iTCP:7801 -sTCP:LISTEN -t || true)"
          if [ "$before" = "$after" ]; then echo "uneti-stop.sh did not stop this copy's server"; exit 1; fi
          kill -0 "$client"
          echo "uneti-stop.sh stopped this copy's server and left a program connected to the page alone"
          kill "$client"
          launchctl unload "$HOME/Library/LaunchAgents/com.uneti.os.plist" || true

      - uses: actions/upload-artifact@v4
        with:
          name: UNETI-AI-macOS
          path: dist/UNETI-AI-macOS.dmg
          if-no-files-found: error

  publish:
    needs: [ windows, macos ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish on the "desktop" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          v="$(tr -d ' \r\n' < VERSION)"
          notes="Desktop installers for UNETI AI (built from ${v}). They install the newest version on first run.

          - Windows 10/11: UNETI-AI-Setup.exe
          - macOS 11+: UNETI-AI-macOS.dmg

          Steps: QUICKSTART.md (Tiếng Việt) or QUICKSTART.en.md (English)."
          if ! gh release view desktop >/dev/null 2>&1; then
            gh release create desktop --title "UNETI AI - Windows & macOS installers" --notes "$notes" --latest=false
          else
            gh release edit desktop --notes "$notes"
          fi
          gh release upload desktop out/UNETI-AI-Setup.exe out/UNETI-AI-macOS.dmg --clobber
          echo "Published installers from ${v}" >> "$GITHUB_STEP_SUMMARY"
